# Everything here is free and offline. This workflow holds no secrets, so a paid call
# cannot succeed even by accident. Never run here: scripts/paid_script.py and
# scripts/paid_estimate_script.py (they bill per call or per page and take minutes). See
# AGENTS.md "Gates". Scripts that are free but read gitignored inputs cannot run from a
# clean checkout either.
#
# The pip line mirrors the setup doc; the repo has no Python manifest by decision. The
# packages were derived by walking the drills' imports transitively, not copied from the
# setup section; a library imported lazily inside a function (an image library, say) is
# invisible to that walk and is named by hand. ruff and pyright are pinned because
# tests/drill_ruff.py and the push pipeline run them as part of the gate and a newer
# release can change what they flag or how they format.
name: Verify
on:
  pull_request:
  push:
permissions:
  contents: read
concurrency:
  # A cancelled run on main leaves no record of whether that commit was green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  group: verify-${{ github.ref }}
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: .github/workflows/verify.yml
      - run: pip install requests ruff==0.17.0 pyright==1.1.414
      - name: Every src/ change carries a drill
        env:
          BEFORE: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: python tests/commit_range.py "$BEFORE" "$HEAD_SHA"
      - name: Boundary checks and failure drills
        env:
          PROJECT_RATCHET_BASE: ${{ github.event.before }}
        run: python tests/run_drills.py
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
