<text x="445" y="94" text-anchor="middle" font-size="12" fill="#FFFFFF" opacity="0.92">facts + proposal</text>
<text x="445" y="112" text-anchor="middle" font-size="12" fill="#FFFFFF" opacity="0.92">Claude</text>
